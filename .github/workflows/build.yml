      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: cd MyAssistant && gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" MyAssistant/app/build/outputs/apk/debug/app-debug.apk --title "My Assistant v${{ github.run_number }}" --notes "Download app-debug.apk"
        
